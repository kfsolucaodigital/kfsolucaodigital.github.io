<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KF Solução Digital</title>
  <meta
    name="description"
    content="Identidade visual da KF Solução Digital."
  >

  <link
    rel="icon"
    href="./empresa/assets/editorial/social/kf-avatar-editorial-512.png"
    type="image/png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f3efe7;
      font-family: Arial, Helvetica, sans-serif;
    }

    img {
      display: block;
      width: min(100%, 520px);
      height: auto;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <main>
    <img
      src="./empresa/assets/editorial/social/kf-avatar-editorial-1024.png"
      alt="Logotipo da KF Solução Digital"
      width="1024"
      height="1024"
    >
  </main>
</body>
</html>
